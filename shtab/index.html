function metric(label,value,foot,icon,accent=''){return `<div class="metric"><div class="metric-top">${ico(icon)} ${label}</div><div class="metric-value">${value}</div><div class="metric-foot">${foot.replace(/\*([^*]+)\*/g,'<span>$1</span>')}</div></div>`}

function listContent(){const host=document.querySelector('#records');if(!host)return;let list=[];if(page==='journal'){list=data.journal.filter(r=>(filter==='all'||r.kind===filter)&&`${r.worker} ${r.type} ${r.actor} ${r.detail}`.toLowerCase().includes(query.toLowerCase()));host.innerHTML=list.length?list.map(r=>`<div class="event"><div class="event-icon">${ico(r.kind==='bl'?'users':'lock')}</div><div class="event-copy"><strong>${esc(r.type)}</strong><div class="event-meta">ID ${esc(r.worker)} · ${esc(r.date)} · ответственный ${esc(r.actor)}</div><div class="event-more">${esc(r.detail)}</div></div></div>`).join(''):`<div class="empty">${ico('search',22)}По запросу событий не найдено.</div>`;}
else{const bl=page==='blacklist';const activeStatus=bl?'В ЧС':'ЗАКРЫТ';list=(bl?data.blacklist:data.modules).filter(r=>(filter==='all'||(filter==='active'?r.status===activeStatus:r.status!==activeStatus))&&`${r.id} ${r.block} ${r.area} ${r.reason} ${r.actor}`.toLowerCase().includes(query.toLowerCase()));host.innerHTML=list.length?list.map(r=>{const active=r.status===activeStatus;return `<article class="record"><div class="record-main"><div class="record-header"><span class="record-id">ID ${esc(r.id)}</span><span class="status ${active?'active':'inactive'}">${esc(r.status)}</span></div><div class="record-sub">${esc(r.block)} / ${esc(r.area)} · ${esc(r.key)} · ${esc(r.date)}</div><div class="record-reason">${esc(r.reason)}</div><div class="record-meta">Условие: ${esc(r.requirement)}<br>Ответственный: ${esc(r.actor)}</div></div><div class="record-actions"><button type="button" class="tiny-btn" data-detail="${esc(r.key)}">Подробнее</button>${active?`<button class="tiny-btn" type="button" data-form="${bl?'bl-remove':'mod-open'}" data-key="${esc(r.key)}">${bl?'Снять с ЧС':'Открыть'}</button>`:''}</div></article>`}).join(''):`<div class="empty">${ico('search',22)}Записи не найдены. Попробуй другой запрос.</div>`;}

function field(label,name,required=true,area=false,placeholder=''){return `<div class="field ${area?'full':''}"><label for="f_${name}">${label}${required?' *':''}</label>${area?`<textarea id="f_${name}" name="${name}" ${required?'required':''} maxlength="600" placeholder="${esc(placeholder)}"></textarea>`:`<input id="f_${name}" name="${name}" type="text" ${required?'required':''} maxlength="160" placeholder="${esc(placeholder)}" />`}</div>`;}

function openForm(kind,key=''){const bl=kind.startsWith('bl');const adding=kind.endsWith('add');const source=bl?data.blacklist:data.modules;const r=source.find(x=>x.key===key);if(!adding&&!r){toast('Запись не найдена');return;}const title=({'mod-add':'Закрыть модуль','mod-open':'Открыть модуль','bl-add':'Внести в ЧС','bl-remove':'Снять с ЧС'})[kind];let form=`${modalHeader(title,adding?'Новое ограничение с обязательным основанием':'Изменение статуса с сохранением истории')}<form id="actionForm" data-kind="${kind}" data-key="${esc(key)}"><div class="form-grid">${adding?field('ID исполнителя','worker',true,false,'Например, 100404'):`<div class="field"><label>ID исполнителя</label><input readonly value="${esc(r.id)}" /></div>`}${options(adding?'Блок':'Где выполнено действие','block',['Б1','Б3','Б4','Б6'])}${field('Подразделение / участок','area',true,false,'Например, Мезонин')}${field(adding?(bl?'Причина внесения в ЧС':'Причина закрытия'):(bl?'Причина снятия с ЧС':'Причина открытия'),'reason',true,true,'Укажи конкретное основание')}${adding?field(bl?'Условия снятия с ЧС':'Что исправить для открытия','requirement',true,true,'Что необходимо выполнить'):field('Кем согласовано (ID или ФИО)','approved',true,false,'Кто согласовал решение')}${field('ID ответственного','actor',true,false,'Рабочий ID')}${field('Комментарий','comment',false,true,'Необязательно')}</div><div class="form-note">Демо-запись будет видна до обновления страницы. В Google Таблицы ничего не отправляется.</div><div class="modal-actions"><button type="submit" class="btn ${adding?'orange':'primary'}">${title} ${ico('arrow')}</button><button type="button" data-action="close" class="btn">Отмена</button></div></form>`;modal(form)}
function detail(key){let r=data.modules.find(x=>x.key===key)||data.blacklist.find(x=>x.key===key);if(!r)return;const bl=r.key.startsWith('BL');const active=bl?r.status==='В ЧС':r.status==='ЗАКРЫТ';modal(`${modalHeader('Карточка исполнителя','История и основания конкретного ограничения')}<div class="information">${ico('info')}<div><strong>ID ${esc(r.id)}</strong> · ${esc(r.key)}<br>Статус: ${esc(r.status)}</div></div><div class="record-reason">Причина: ${esc(r.reason)}</div><div class="record-meta" style="line-height:2.3">${bl?'Условия снятия':'Для открытия'}: ${esc(r.requirement)}<br>Блок: ${esc(r.block)} / ${esc(r.area)}<br>Ответственный: ${esc(r.actor)}<br>Дата: ${esc(r.date)}</div><div class="modal-actions" style="margin-top:22px">${active?`<button type="button" class="btn primary" data-form="${bl?'bl-remove':'mod-open'}" data-key="${esc(r.key)}">${bl?'Снять с ЧС':'Открыть модуль'}</button>`:''}<button type="button" data-action="close" class="btn">Закрыть</button></div>`)}
function saveForm(form){const kind=form.dataset.kind,key=form.dataset.key;const values=Object.fromEntries(new FormData(form).entries());Object.keys(values).forEach(k=>values[k]=String(values[k]).trim());if(!/^\d{2,15}$/.test(values.actor)){toast('ID ответственного должен содержать 2–15 цифр');return;}if(kind.endsWith('add')&&!/^\d{2,15}$/.test(values.worker)){toast('ID исполнителя должен содержать 2–15 цифр');return;}
const bl=kind.startsWith('bl'), adding=kind.endsWith('add'), source=bl?data.blacklist:data.modules, activeStatus=bl?'В ЧС':'ЗАКРЫТ';let r;if(adding){if(source.some(x=>x.id===values.worker&&x.status===activeStatus)){toast('У этого ID уже есть действующее ограничение');return;}r={key:`${bl?'BL':'MOD'}-DEMO-${String(seq++).padStart(3,'0')}`,id:values.worker,status:activeStatus,block:values.block,area:values.area,reason:values.reason,requirement:values.requirement,actor:values.actor,date:dt(),comment:values.comment};source.unshift(r);}else{r=source.find(x=>x.key===key);if(!r||r.status!==activeStatus){toast('Ограничение уже снято или не найдено');return;}r.status=bl?'СНЯТ':'ОТКРЫТ';r.approved=values.approved;r.updatedAt=dt();}
const type=adding?(bl?'ВНЕСЕНИЕ В ЧС':'ЗАКРЫТИЕ МОДУЛЯ'):(bl?'СНЯТИЕ С ЧС':'ОТКРЫТИЕ МОДУЛЯ');data.journal.unshift({key:'EV-DEMO-'+seq++,worker:r.id,kind:bl?'bl':'module',type,date:dt(),actor:values.actor,detail:`${values.block} / ${values.area} · ${values.reason}${values.approved?' · Согласовано: '+values.approved:''}`});closeModal();render();toast('Тестовое действие сохранено');}
function toast(message){const node=document.createElement('div');node.className='toast';node.textContent=message;const root=document.querySelector('#toastRoot');root.replaceChildren(node);setTimeout(()=>{if(root.contains(node))node.remove()},3000)}
document.addEventListener('click',e=>{const target=e.target.closest('[data-tab],[data-form],[data-filter],[data-action],[data-detail]');if(!target){if(e.target.matches('[data-overlay="true"]'))closeModal();return;}if(target.dataset.tab){setPage(target.dataset.tab);return;}if(target.dataset.form){openForm(target.dataset.form,target.dataset.key||'');return;}if(target.dataset.detail){detail(target.dataset.detail);return;}if(target.dataset.filter){filter=target.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('selected',b.dataset.filter===filter));listContent();return;}if(target.dataset.action==='close')closeModal();if(target.dataset.action==='reset'){data=seed();seq=4;render();toast('Демонстрационные данные восстановлены');}if(target.dataset.action==='about')modal(`${modalHeader('О проекте «ШТАБ»','Одна платформа для разных рабочих инструментов')}<div class="information">${ico('spark')}<div>Этот концепт демонстрирует дизайн будущего мини-приложения MAX. Сначала — закрытые модули и ЧС грузчиков. Другие разделы можно добавлять без нового бота.</div></div><p class="record-meta" style="line-height:2">Цветовая система: Midnight #0A0F14, Deep Teal #0F3D3E, Slate Teal #2E6F73, Mist #7FB3B8, Ivory #EADCC8, Copper #C6601F.</p><button type="button" class="btn primary" data-action="close">Понятно</button>`);if(target.dataset.action==='future')modal(`${modalHeader('Новые инструменты','Масштабируем платформу без переделки меню')}<div class="information">${ico('box')}<div>Со временем здесь появятся отчёты, аналитика, поиск потерь и другие задачи. Пока раздел специально оставлен пустым.</div></div><button type="button" class="btn primary" data-action="close">Закрыть</button>`);});
document.addEventListener('input',e=>{if(e.target.id==='liveSearch'){query=e.target.value;listContent();}});
document.addEventListener('submit',e=>{if(e.target.id==='actionForm'){e.preventDefault();saveForm(e.target);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.querySelector('#todayDate').textContent=today();render();

</script>
</body>
</html>
