<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A0F14">
<title>ШТАБ · Центр управления</title>
<style>
:root{color-scheme:dark;--bg:#0A0F14;--panel:#111D22;--panel2:#14272C;--line:#274049;--text:#F0F7F6;--muted:#91A9AD;--teal:#7FB3B8;--sand:#EADCC8;--orange:#C6601F;--ok:#A3DBC8;--bad:#F1A3A0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 76% 0%,#0C3437 0,transparent 39%),radial-gradient(ellipse at -20% 90%,#51270F 0,transparent 33%),var(--bg);color:var(--text);font-size:14px;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #A5DEDD;outline-offset:3px}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh;max-width:1680px;margin:auto}.side{padding:29px 17px;border-right:1px solid #263B43;background:linear-gradient(160deg,#0C1419,#101F24);display:flex;flex-direction:column;gap:36px}.brand{display:flex;align-items:center;gap:13px;padding:5px 11px}.mark{height:41px;width:41px;display:grid;place-items:center;border-radius:14px;color:#092124;background:linear-gradient(145deg,#DDF2E9,#77AEB0);box-shadow:0 9px 30px #519EA444;font-weight:900;font-size:25px}.brand b{letter-spacing:.13em;font-size:19px}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.14em;margin-top:4px}.side-label{text-transform:uppercase;color:#637F86;font-weight:800;letter-spacing:.17em;font-size:10px;padding:0 13px 8px}.nav button{display:flex;align-items:center;gap:12px;color:#A1B7BB;background:none;border:1px solid transparent;border-radius:13px;text-align:left;width:100%;padding:13px 12px;margin:2px 0;transition:.2s}.nav button:hover{background:#20353A;color:#fff}.nav button.on{background:linear-gradient(100deg,#234449,#1B3037);border-color:#3D676B;color:#F8FFFF}.nav .symbol{width:22px;text-align:center;font-size:18px}.side-foot{margin-top:auto;font-size:11px;color:#81979C;border-top:1px solid #2A4048;padding:17px 11px}.main{padding:28px clamp(20px,4.2vw,62px) 100px;max-width:1400px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;color:#91A5A9;margin-bottom:32px;font-size:12px}.top b{color:var(--text);font-weight:600}.top .live{display:flex;gap:9px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 14px #8CCFC7}
.hero{position:relative;overflow:hidden;border-radius:28px;min-height:255px;padding:38px clamp(23px,4vw,53px);background:radial-gradient(circle at 88% 28%,#3F8F91 0,transparent 26%),radial-gradient(circle at 93% 110%,#B75B21 0,transparent 32%),linear-gradient(115deg,#122126,#163C43 67%,#203D41);border:1px solid #3B6769;box-shadow:0 34px 80px #0006}.hero:before{content:"";position:absolute;right:8%;top:18%;width:175px;height:175px;border:1px solid #A4D8D86E;border-radius:42px;transform:rotate(-22deg);box-shadow:0 0 0 27px #B8E8E812,0 0 0 57px #B6E7E40A}.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:10px;font-weight:800;color:#B5D9DA}.hero h1{font-size:clamp(34px,5vw,59px);line-height:1.07;letter-spacing:-.045em;margin:17px 0}.hero h1 em{font-style:normal;color:#AFDEDB}.hero p{max-width:420px;color:#C1D4D3;font-size:13px;line-height:1.65;margin:0}.tiny{color:var(--muted);font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:31px 0 15px}.section-title h2{margin:0;font-size:23px;letter-spacing:-.03em}.section-title p{color:var(--muted);margin:5px 0 0;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.tile{background:linear-gradient(135deg,#192D32,#102026);border:1px solid #34545C;border-radius:21px;padding:23px;min-height:179px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:var(--text);box-shadow:0 20px 45px #0002}.tile:hover{border-color:#7AB4B6;transform:translateY(-2px)}.tile .tile-icon{font-size:24px;height:51px;width:51px;background:#285259;border-radius:16px;display:grid;place-items:center;margin-bottom:17px}.tile h3{margin:0 0 6px;font-size:19px;letter-spacing:-.035em}.tile p{margin:0;font-size:12px;color:#9BB5B8}.tile.orange{background:linear-gradient(140deg,#31251E,#1A2225);border-color:#644632}.tile.orange .tile-icon{background:#6B3824}.tile.ghost{border-style:dashed;border-color:#45636A;color:#A9C4C6}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:19px}.metric{padding:19px 22px;background:#122126B8;border:1px solid #314951;border-radius:18px}.metric b{display:block;font-size:31px;font-weight:600;letter-spacing:-.05em;margin:9px 0 2px}.metric span{font-size:11px;color:var(--muted)}.metric .cap{color:#D1E3E2;text-transform:uppercase;letter-spacing:.08em;font-size:10px}
.panel{padding:24px;border:1px solid #315159;border-radius:23px;background:linear-gradient(140deg,#16282F,#101B21);margin-top:18px;box-shadow:0 20px 70px #0002}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px;flex-wrap:wrap}.panel-head h2{margin:0;font-size:26px;letter-spacing:-.04em}.panel-head p{color:#95ACB0;font-size:12px;margin:5px 0 0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.search{padding:12px 14px;background:#0F1D23;color:var(--text);border:1px solid #35545D;border-radius:12px;flex:1;min-width:190px}.btn{padding:12px 16px;border-radius:12px;background:linear-gradient(140deg,#BCDAD6,#78B7B8);border:0;color:#102329;font-weight:700}.btn:hover{filter:brightness(1.08)}.btn.light{background:#2A444A;color:#DBF1F0;border:1px solid #507178}.btn.warn{background:#B9673A;color:white}.btn.small{padding:8px 11px;font-size:11px}.select{background:#12232B;border:1px solid #426067;border-radius:12px;color:var(--text);padding:11px}.rows{display:flex;flex-direction:column;gap:9px}.record{padding:16px;background:#13262B;border:1px solid #29454D;border-radius:15px;display:flex;justify-content:space-between;align-items:center;gap:15px}.record strong{font-size:15px}.record p{font-size:12px;color:#9CB2B6;margin:5px 0 0}.record-right{display:flex;align-items:center;gap:13px}.status{border:1px solid #4C7E78;background:#1B3B3B;color:#B4E3D7;border-radius:100px;padding:5px 10px;white-space:nowrap;font-size:11px}.status.alert{border-color:#A65A4B;background:#4F2E2C;color:#F5BCB1}.empty{text-align:center;padding:28px;color:#829BA0}.hint{color:#87A1A5;font-size:11px;margin-top:14px}.hidden{display:none!important}.bottom{display:none}.modal-bg{position:fixed;inset:0;background:#040B0ED9;z-index:10;display:grid;place-items:center;padding:15px;backdrop-filter:blur(12px)}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:linear-gradient(155deg,#1B353B,#101E24);border:1px solid #5B8589;border-radius:24px;padding:25px;box-shadow:0 35px 90px #0009}.modal h2{font-size:25px;margin:0}.modal p{font-size:12px;color:#A1B8BA}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.formgrid label{font-size:11px;color:#D1E2E2;display:block}.formgrid .wide{grid-column:1/-1}.formgrid input,.formgrid select,.formgrid textarea{width:100%;margin-top:6px;border:1px solid #4D7075;color:#F3FAFA;background:#102329;border-radius:11px;padding:11px}.formgrid textarea{resize:vertical;min-height:76px}.modal-actions{display:flex;justify-content:flex-end;gap:9px}.toast{position:fixed;bottom:28px;right:30px;background:#D1E6DE;color:#163135;padding:13px 18px;border-radius:12px;box-shadow:0 15px 40px #0008;z-index:30;font-weight:700}
@media(max-width:760px){.shell{display:block}.side{display:none}.main{padding:19px 15px 110px}.top{margin-bottom:20px}.hero{min-height:240px;padding:28px 23px}.hero:before{right:-45px;top:20px}.cards{gap:11px}.tile{min-height:158px;padding:15px}.tile h3{font-size:16px}.tile .tile-icon{width:42px;height:42px;border-radius:12px;margin-bottom:13px}.metrics{gap:7px}.metric{padding:13px 10px}.metric b{font-size:25px}.metric .cap{font-size:9px}.panel{padding:16px}.record{align-items:flex-start;flex-direction:column}.record-right{width:100%;justify-content:space-between}.bottom{position:fixed;display:flex;bottom:0;left:0;right:0;z-index:5;justify-content:space-around;background:#0C1A20ED;border-top:1px solid #37545C;backdrop-filter:blur(20px);padding:10px 4px max(10px,env(safe-area-inset-bottom))}.bottom button{border:0;background:none;color:#8BA5A7;font-size:10px;padding:5px 7px;min-width:55px}.bottom button.on{color:#D1F3EC}.bottom b{display:block;font-size:20px;margin-bottom:2px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}}
</style></head>
<body><div class="shell"><aside class="side"><div class="brand"><span class="mark">✦</span><div><b>ШТАБ</b><small>CONTROL CENTER</small></div></div><div><div class="side-label">Разделы</div><nav id="navigation" class="nav"></nav></div><div class="side-foot">Демонстрационная среда · v0.2<br>Только тестовые записи</div></aside><main class="main"><div class="top"><span><b>ШТАБ</b> / <span id="where">Главная</span></span><span class="live"><i class="dot"></i> Демо-режим</span></div><div id="view"></div></main></div><div class="bottom" id="bottom"></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(function(){
"use strict";
var current="home",search="",filter="all",sequence=3;
var pages=[["home","Главная","⌂"],["modules","Модули","▣"],["blacklist","ЧС","◈"],["journal","Журнал","◷"]];
var modules=[{key:"MOD-001",id:"100101",block:"Б3",unit:"Сборка",reason:"Нарушение технологического процесса",fix:"Повторный инструктаж",actor:"900001",status:"ЗАКРЫТ"},{key:"MOD-002",id:"100102",block:"Б4",unit:"Автосортер",reason:"Повторное нарушение",fix:"Согласование с руководителем",actor:"900002",status:"ОТКРЫТ"}];
var blacklist=[{key:"BL-001",id:"100103",block:"Б3",unit:"Предсорт",reason:"Нарушение правил работы",fix:"Проверка руководителем",actor:"900001",status:"В ЧС"}];
var journal=[{time:"Демо",action:"Закрытие модуля",id:"100101",actor:"900001",details:"Нарушение технологического процесса"},{time:"Демо",action:"Внесение в ЧС",id:"100103",actor:"900001",details:"Нарушение правил работы"}];
function h(s){return String(s==null?"":s).replace(/[&<>"']/g,function(x){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]})}
function label(p){for(var i=0;i<pages.length;i++)if(pages[i][0]===p)return pages[i][1];return "Главная"}
function navi(){var a=pages.map(function(p){return '<button data-page="'+p[0]+'" class="'+(p[0]===current?'on':'')+'"><span class="symbol">'+p[2]+'</span>'+p[1]+'</button>'}).join("");document.getElementById("navigation").innerHTML=a;document.getElementById("bottom").innerHTML=pages.map(function(p){return '<button data-page="'+p[0]+'" class="'+(p[0]===current?'on':'')+'"><b>'+p[2]+'</b>'+p[1]+'</button>'}).join("");document.getElementById("where").textContent=label(current)}
function stat(t,v){return '<div class="metric"><div class="cap">'+t+'</div><b>'+v+'</b><span>Демонстрационные данные</span></div>'}
function home(){var closed=modules.filter(function(x){return x.status==="ЗАКРЫТ"}).length,bl=blacklist.filter(function(x){return x.status==="В ЧС"}).length;return '<section class="hero"><div class="eyebrow">Цифровое рабочее пространство</div><h1>Всё важное.<br><em>В одном месте.</em></h1><p>Управление доступом, контроль ограничений и новые рабочие инструменты в одной системе.</p></section><div class="metrics">'+stat("Закрыто модулей",closed)+stat("Активный ЧС",bl)+stat("Событий",journal.length)+'</div><div class="section-title"><div><h2>Инструменты</h2><p>Выбери раздел для работы</p></div><span class="tiny">Модульная система</span></div><div class="cards"><button class="tile" data-page="modules"><span class="tile-icon">▣</span><h3>Закрытые модули</h3><p>Ограничения, основания, открытия</p></button><button class="tile orange" data-page="blacklist"><span class="tile-icon">◈</span><h3>ЧС грузчиков</h3><p>Учёт ограничений часовой оплаты</p></button><button class="tile" data-page="journal"><span class="tile-icon">◷</span><h3>Журнал событий</h3><p>Кто, когда и что изменил</p></button><button class="tile ghost" data-action="future"><span class="tile-icon">＋</span><h3>Новый инструмент</h3><p>Будущие проекты появятся здесь</p></button></div><p class="hint">Этот прототип не связан с MAX, Google Таблицами и реальными данными сотрудников.</p>'}
function rows(){var data=current==="modules"?modules:current==="blacklist"?blacklist:journal;var isLog=current==="journal";var active=current==="modules"?"ЗАКРЫТ":"В ЧС";var arr=data.filter(function(r){var txt=(r.id+" "+(r.block||"")+" "+(r.reason||r.details||"")+" "+(r.unit||"")).toLowerCase();return txt.indexOf(search.toLowerCase())>=0&&(filter==="all"||isLog||(filter==="active"?r.status===active:r.status!==active))});if(!arr.length)return '<div class="empty">Ничего не найдено</div>';return arr.map(function(r){if(isLog)return '<article class="record"><div><strong>'+h(r.action)+' · ID '+h(r.id)+'</strong><p>'+h(r.details)+'</p></div><div class="record-right"><span class="tiny">'+h(r.time)+' · '+h(r.actor)+'</span></div></article>';var live=r.status===active;return '<article class="record"><div><strong>ID '+h(r.id)+'</strong><p>'+h(r.block)+' / '+h(r.unit)+' · '+h(r.reason)+'</p><p class="tiny">№ '+h(r.key)+' · Ответственный '+h(r.actor)+'</p></div><div class="record-right"><span class="status '+(live?'alert':'')+'">'+h(r.status)+'</span><button class="btn small light" data-action="detail" data-key="'+h(r.key)+'">Подробнее</button></div></article>'}).join("")}
function section(){var mod=current==="modules",log=current==="journal";return '<div class="panel"><div class="panel-head"><div><h2>'+(mod?'Закрытые модули':log?'Журнал событий':'ЧС грузчиков')+'</h2><p>'+(mod?'История ограничений и восстановление допуска':log?'Все операции сохраняются отдельными событиями':'Учёт ограничений на часовую оплату')+'</p></div>'+(log?'':'<button class="btn" data-action="add">'+(mod?'Закрыть модуль':'Внести в ЧС')+'</button>')+'</div><div class="toolbar"><input id="search" class="search" placeholder="Поиск по ID, причине, блоку..." value="'+h(search)+'">'+(log?'':'<select id="filter" class="select"><option value="all" '+(filter==="all"?"selected":"")+'>Все статусы</option><option value="active" '+(filter==="active"?"selected":"")+'>Активные</option><option value="closed" '+(filter==="closed"?"selected":"")+'>Завершённые</option></select>')+'</div><div class="rows" id="rows">'+rows()+'</div><p class="hint">Демо. Изменения сохраняются только до перезагрузки страницы.</p></div>'}
function render(){navi();document.getElementById("view").innerHTML=current==="home"?home():section()}
function field(name,title,type,value,wide){return '<label class="'+(wide?'wide':'')+'">'+title+' *'+(type==="textarea"?'<textarea name="'+name+'" required>'+h(value||"")+'</textarea>':'<input name="'+name+'" required autocomplete="off" value="'+h(value||"")+'" '+(type==="number"?'inputmode="numeric" pattern="[0-9]*"':'')+'>')+'</label>'}
function modal(title,desc,fields,saveText,kind,key){document.getElementById("modalRoot").innerHTML='<div class="modal-bg" id="overlay"><div class="modal"><h2>'+h(title)+'</h2><p>'+h(desc)+'</p><form id="actionForm" data-kind="'+kind+'" data-key="'+h(key||"")+'"><div class="formgrid">'+fields+'</div><div class="modal-actions"><button class="btn light" type="button" data-action="close">Отмена</button><button class="btn" type="submit">'+h(saveText)+'</button></div></form></div></div>'}
function add(){var bl=current==="blacklist";modal(bl?'Внести в ЧС':'Закрыть модуль',bl?'Заполните основание ограничения часовой оплаты':'Заполните основание и условия восстановления допуска',field("id","ID исполнителя","number")+field("block","Блок","text")+field("unit","Участок / подразделение","text")+field("actor","ID ответственного","number")+field("reason","Причина","textarea","",true)+field("fix","Условия снятия / открытия","textarea","",true),bl?'Внести в ЧС':'Закрыть модуль',bl?'bl-add':'mod-add',"")}
function detail(key){var bl=key.indexOf("BL-")===0;var r=(bl?blacklist:modules).find(function(x){return x.key===key});if(!r)return;var active=bl?r.status==="В ЧС":r.status==="ЗАКРЫТ";var fields='<div class="wide"><b>ID '+h(r.id)+'</b><p>'+h(r.block)+' / '+h(r.unit)+'</p><p>Причина: '+h(r.reason)+'</p><p>Условия: '+h(r.fix)+'</p><p>Ответственный: '+h(r.actor)+'</p><p>Статус: '+h(r.status)+'</p></div>';if(active)fields+=field("actor","ID ответственного за снятие","number")+field("reason","Причина снятия / открытия","textarea","",true)+field("approved","Кем согласовано","text");modal("Карточка исполнителя","История ограничений сохраняется",fields,active?(bl?'Снять с ЧС':'Открыть модуль'):'Закрыть',active?(bl?'bl-close':'mod-close'):'noop',key);if(!active)document.getElementById("actionForm").querySelector('[type="submit"]').classList.add("hidden")}
function now(){return new Date().toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
function notify(msg){document.getElementById("toastRoot").innerHTML='<div class="toast">'+h(msg)+'</div>';setTimeout(function(){document.getElementById("toastRoot").innerHTML=""},2900)}
function submit(e){e.preventDefault();var f=e.target,kind=f.dataset.kind,key=f.dataset.key,v=Object.fromEntries(new FormData(f).entries());Object.keys(v).forEach(function(k){v[k]=String(v[k]).trim()});if(Object.values(v).some(function(z){return !z})){notify("Заполните все поля");return}if(!/^[0-9]+$/.test(v.actor)||v.id&&!/^[0-9]+$/.test(v.id)){notify("ID должен содержать только цифры");return}if(kind==="bl-add"||kind==="mod-add"){var bl=kind==="bl-add";var row={key:(bl?"BL-":"MOD-")+String(++sequence).padStart(4,"0"),id:v.id,block:v.block,unit:v.unit,reason:v.reason,fix:v.fix,actor:v.actor,status:bl?"В ЧС":"ЗАКРЫТ"};(bl?blacklist:modules).unshift(row);journal.unshift({time:now(),action:bl?"Внесение в ЧС":"Закрытие модуля",id:v.id,actor:v.actor,details:v.reason});notify("Тестовая запись добавлена")}else if(kind==="bl-close"||kind==="mod-close"){var isBL=kind==="bl-close";var r=(isBL?blacklist:modules).find(function(x){return x.key===key});if(r){r.status=isBL?"СНЯТ":"ОТКРЫТ";journal.unshift({time:now(),action:isBL?"Снятие с ЧС":"Открытие модуля",id:r.id,actor:v.actor,details:v.reason+" · Согласовано: "+v.approved});notify("Тестовый статус изменён")}}document.getElementById("modalRoot").innerHTML="";render()}
document.addEventListener("click",function(e){var b=e.target.closest("[data-page], [data-action]");if(!b)return;if(b.dataset.page){current=b.dataset.page;search="";filter="all";render();window.scrollTo({top:0,behavior:"smooth"});return}var act=b.dataset.action;if(act==="add")add();if(act==="detail")detail(b.dataset.key);if(act==="close")document.getElementById("modalRoot").innerHTML="";if(act==="future")notify("Место для следующего модуля")});
document.addEventListener("input",function(e){if(e.target.id==="search"){search=e.target.value;document.getElementById("rows").innerHTML=rows()}});document.addEventListener("change",function(e){if(e.target.id==="filter"){filter=e.target.value;document.getElementById("rows").innerHTML=rows()}});document.addEventListener("submit",function(e){if(e.target.id==="actionForm")submit(e)});document.addEventListener("click",function(e){if(e.target.id==="overlay")document.getElementById("modalRoot").innerHTML=""});render();
})();
</script></body></html>
